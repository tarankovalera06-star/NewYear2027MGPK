<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Волшебная ёлка — Новый год</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#ffd66b;--txt:#f4f7ff;--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--txt);font-family:'Montserrat',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0,#1a2f7a 0,#0a1440 45%,#030818 100%);overflow-x:hidden}
#snow{position:fixed;inset:0;pointer-events:none;z-index:1}
.st{position:fixed;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.au{position:fixed;left:-20%;width:140%;height:45vh;filter:blur(60px);opacity:.35;animation:au 14s infinite alternate ease-in-out;pointer-events:none}
.a1{top:-10vh;background:linear-gradient(90deg,transparent,#19e6a0,#3b7bff,transparent)}
.a2{top:5vh;background:linear-gradient(90deg,transparent,#b44bff,#19c7e6,transparent);animation-delay:-6s;opacity:.25}
@keyframes au{to{transform:translateX(8%) skewX(-8deg);opacity:.5}}
.sh{position:fixed;height:2px;width:120px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(25deg);animation:sh 1.4s linear forwards;z-index:0}
@keyframes sh{from{opacity:1}to{transform:translate(380px,180px) rotate(25deg);opacity:0}}
.santa{position:fixed;top:12vh;font-size:44px;z-index:2;white-space:nowrap;animation:fly 18s linear forwards;pointer-events:none;filter:drop-shadow(0 0 12px #ffd66b)}
@keyframes fly{from{left:-200px;transform:translateY(0)}50%{transform:translateY(-30px)}to{left:105vw;transform:translateY(20px)}}
.wrap{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;padding:22px 14px 40px}
h1{font-family:'Marck Script',cursive;font-weight:400;font-size:clamp(34px,7vw,64px);margin:0;text-align:center;background:linear-gradient(180deg,#fff6c9,#ffc94d 60%,#ff9d2e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,200,80,.55))}
.sub{opacity:.8;margin:4px 0 16px;letter-spacing:.04em;text-align:center}
.cds{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cd{width:78px;padding:12px 0 8px;text-align:center;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25)}
.cd b{display:block;font-size:34px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 14px #ffc94d}
.cd b.pop{animation:pop .45s}
@keyframes pop{40%{transform:translateY(-6px) scale(1.15);color:var(--gold)}}
.cd i{font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.14em;opacity:.7}
#tree{width:min(94vw,470px);height:auto;margin-top:8px;overflow:visible}
.L{animation:tl 1.8s infinite ease-in-out}
@keyframes tl{0%,100%{opacity:1}50%{opacity:.25}}
.sw{animation:sw 3.6s infinite ease-in-out;transform-origin:0 -24px}
@keyframes sw{50%{transform:rotate(7deg)}}
.b{cursor:pointer}
.bi{transition:transform .25s;transform-box:fill-box;transform-origin:center}
.b:hover .bi{transform:scale(1.22)}
.b:hover circle.hl{opacity:1}
.pulse{animation:pl 1.2s infinite ease-in-out;transform-origin:center;transform-box:fill-box}
@keyframes pl{50%{transform:scale(1.15);opacity:.6}}
.hint{opacity:.75;font-size:14px;text-align:center;margin-top:6px;animation:tw 3s infinite}
#mus{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);font-size:22px;cursor:pointer;color:#fff}
.sp{position:fixed;pointer-events:none;z-index:9;color:#ffe59a;animation:sp .8s forwards;text-shadow:0 0 8px #ffc94d}
@keyframes sp{to{transform:translateY(24px) scale(0);opacity:0}}
#m{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(2,6,24,.75);backdrop-filter:blur(6px)}
#m.on{display:flex;animation:fi .3s}
@keyframes fi{from{opacity:0}}
.c{position:relative;width:min(760px,100%);max-height:92vh;overflow:auto;padding:26px 22px;border-radius:24px;background:linear-gradient(160deg,rgba(40,60,140,.85),rgba(12,20,70,.92));border:1px solid var(--line);box-shadow:0 20px 80px rgba(0,0,0,.6),0 0 60px rgba(255,200,80,.15);animation:zi .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes zi{from{transform:scale(.7) translateY(30px);opacity:0}}
.c h2{font-family:'Marck Script',cursive;font-weight:400;font-size:38px;margin:0 30px 12px 0;color:var(--gold);text-shadow:0 0 14px rgba(255,200,80,.5)}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:#fff;cursor:pointer;font-size:16px}
.btn{font:600 14px 'Montserrat',sans-serif;padding:10px 16px;margin:4px;border:0;border-radius:999px;cursor:pointer;color:#3a2200;background:linear-gradient(180deg,#ffe58a,#ffb830);box-shadow:0 4px 16px rgba(255,184,48,.4)}
.btn:hover{filter:brightness(1.1)}
.row{display:flex;flex-wrap:wrap;justify-content:center;margin-top:8px}
.letter p{margin:0 0 12px;line-height:1.65;opacity:0;animation:rise .8s forwards}
@keyframes rise{from{transform:translateY(14px)}to{opacity:1}}
canvas.cv{width:100%;max-width:100%;border-radius:16px;background:#050b24;display:block;margin:0 auto;border:1px solid var(--line)}
input,textarea{width:100%;margin:4px 0 10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font:inherit}
label{font-size:13px;opacity:.8}
.poem{white-space:pre-line;line-height:1.8;font-size:18px;text-align:center;animation:rise .6s}
.gift{font-size:120px;text-align:center;cursor:pointer;user-select:none;animation:gs 1.6s infinite;filter:drop-shadow(0 0 20px #ff4d6d)}
.gift.o{animation:go .7s forwards}
@keyframes gs{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(8deg)}30%{transform:rotate(0)}}
@keyframes go{50%{transform:scale(1.4) rotate(10deg)}}
.pred{font-size:22px;text-align:center;min-height:90px;color:#fff;margin:10px 0;animation:rise .7s}
.cf{position:fixed;top:-30px;z-index:20;font-size:26px;pointer-events:none;animation:cf 2.6s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
.tabs{display:flex;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn.off{background:var(--glass);color:#fff;box-shadow:none}

h1{order:1}.sub{order:2}#tree{order:3}.hint{order:4}.cds{order:5;margin-top:18px}
.moon{position:fixed;top:5vh;right:7vw;width:70px;height:70px;border-radius:50%;z-index:0;background:radial-gradient(circle at 35% 35%,#fffbe8,#f3e3a8 60%,#cdb676);box-shadow:0 0 60px 20px rgba(255,240,180,.35),0 0 160px 60px rgba(255,240,180,.15)}
body.intro #snow{z-index:51}
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2f1370,#0a0a38 55%,#02030f);transition:opacity 1.1s,transform 1.1s}
#intro.out{opacity:0;transform:scale(1.25);pointer-events:none}
.ray{position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(rgba(255,210,120,.08) 0 6deg,transparent 6deg 12deg);animation:rot 70s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ig{position:absolute;top:0;left:0;right:0;height:70px}
.ig::before,.ig::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#ff4d4d 0 5px,transparent 6px) 0 24px/52px 48px,radial-gradient(circle,#4dd2ff 0 5px,transparent 6px) 26px 36px/52px 48px;filter:drop-shadow(0 0 6px #ff9);animation:tl 1.3s infinite}
.ig::after{background:radial-gradient(circle,#ffd34d 0 5px,transparent 6px) 13px 30px/52px 48px,radial-gradient(circle,#7dff7d 0 5px,transparent 6px) 39px 42px/52px 48px;animation-delay:-.65s}
.it{position:relative;font-family:'Marck Script',cursive;font-size:clamp(56px,15vw,140px);line-height:.95;text-align:center;background:linear-gradient(180deg,#fff8d6,#ffc94d 55%,#ff8f2e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,190,70,.7));animation:zi 1.6s cubic-bezier(.2,1.3,.4,1)}
.is{position:relative;letter-spacing:.6em;font-size:22px;margin:14px 0 34px;color:#ffe9a0;animation:rise 2s}
#enter{position:relative;font:600 18px 'Montserrat',sans-serif;padding:16px 34px;border:0;border-radius:999px;cursor:pointer;color:#3a2200;background:linear-gradient(180deg,#ffe58a,#ffb830);animation:pl 1.8s infinite,rise 3s;box-shadow:0 0 40px rgba(255,184,48,.6)}
.vl{text-align:center;margin:6px;font-size:14px;color:var(--gold)}
#qr{background:#fff;padding:12px;border-radius:14px;display:inline-block;margin:10px}

.btn{position:relative;overflow:hidden;font:600 14px 'Montserrat',sans-serif;letter-spacing:.07em;padding:12px 24px;margin:5px;border:1px solid rgba(255,238,175,.75);border-radius:999px;color:#3a2200;background:linear-gradient(180deg,#fff1b0,#ffc02e 55%,#e8901c);box-shadow:0 4px 0 #a8620f,0 8px 22px rgba(255,184,48,.45),inset 0 1px 0 #fff;transition:transform .2s,box-shadow .2s,filter .2s,background .3s;cursor:pointer;-webkit-tap-highlight-color:transparent;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn::before{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg);transition:left .7s}
.btn:hover::before{left:140%}
.btn:hover{transform:translateY(-3px);filter:brightness(1.08);box-shadow:0 7px 0 #a8620f,0 14px 30px rgba(255,184,48,.6),inset 0 1px 0 #fff}
.btn:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 #a8620f,0 3px 10px rgba(255,184,48,.4)}
.btn.off{background:rgba(255,255,255,.08);color:#fff;border-color:var(--line);text-shadow:none;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn.off:hover{background:rgba(255,255,255,.2);box-shadow:0 7px 0 rgba(0,0,0,.35),0 10px 24px rgba(255,255,255,.12)}
.tabs .btn.off{box-shadow:0 4px 0 rgba(0,0,0,.35)}
.arb{order:5;margin-top:16px;font-size:15px;padding:14px 30px;animation:glw 2.4s infinite}
@keyframes glw{50%{box-shadow:0 4px 0 #a8620f,0 8px 44px rgba(255,225,120,.95),inset 0 1px 0 #fff}}
.hint{animation:none;opacity:.8}
.x{font-size:18px;transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .25s,box-shadow .25s,border-color .25s}
.x:hover{transform:rotate(180deg) scale(1.18);background:linear-gradient(180deg,#ff8a8a,#d62839);border-color:#fff;box-shadow:0 0 22px rgba(255,90,90,.8)}
.x:active{transform:rotate(180deg) scale(.9)}
#mus{font-size:24px;color:#ffe9a0;transition:transform .25s,box-shadow .25s;box-shadow:0 0 18px rgba(255,200,80,.35)}
#mus:hover{transform:scale(1.12) rotate(-8deg);box-shadow:0 0 30px rgba(255,200,80,.8)}
#mus.mute::after{content:"";position:absolute;width:30px;height:2px;background:#ff7a7a;transform:rotate(-45deg);top:22px;left:8px}
#intro #enter{font-family:'Marck Script',cursive;font-size:clamp(28px,6vw,42px);font-weight:400;letter-spacing:.03em;padding:16px 56px 20px;border:2px solid #fff3b8;border-radius:60px;color:#4a2500;background:linear-gradient(180deg,#fff8c9,#ffd24d 45%,#f0951f);box-shadow:0 0 0 6px rgba(255,210,100,.25),0 0 50px rgba(255,190,60,.7),inset 0 2px 0 #fff,inset 0 -8px 14px rgba(160,80,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.8);animation:glw2 2.4s infinite,rise 3s;overflow:hidden;transition:transform .25s}
#intro #enter:hover{transform:scale(1.07)}#intro #enter:active{transform:scale(.96)}
#intro #enter::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-20deg);animation:shim 2.6s infinite}
@keyframes shim{to{left:140%}}
@keyframes glw2{50%{box-shadow:0 0 0 14px rgba(255,210,100,.1),0 0 90px rgba(255,200,80,1),inset 0 2px 0 #fff,inset 0 -8px 14px rgba(160,80,0,.35)}}
.sign{position:relative;order:0;margin-top:58px;animation:drop 1.9s cubic-bezier(.25,1.3,.5,1) both,swing 7s 2.2s infinite ease-in-out;transform-origin:50% -60px}
body.intro .sign{animation:none;opacity:0}
@keyframes drop{from{transform:translateY(-160%) rotate(-7deg);opacity:0}to{transform:none;opacity:1}}
@keyframes swing{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.rope{position:absolute;top:-62px;width:3px;height:70px;background:linear-gradient(#ffe9a0,#a87b1c);box-shadow:0 0 8px rgba(255,200,80,.6)}
.rope.l{left:12%;transform:rotate(14deg);transform-origin:bottom}.rope.r{right:12%;transform:rotate(-14deg);transform-origin:bottom}
.board{position:relative;padding:20px 26px 18px;border-radius:22px;text-align:center;background:linear-gradient(160deg,rgba(40,50,130,.92),rgba(12,18,70,.95));border:2px solid #ffd66b;box-shadow:0 0 0 5px rgba(255,214,107,.15),0 14px 50px rgba(0,0,0,.6),0 0 60px rgba(255,190,70,.3),inset 0 0 30px rgba(255,255,255,.07)}
.sign .lt{top:-16px;left:8px;right:8px;height:50px;z-index:2;pointer-events:none}
.board h1{font-size:clamp(26px,5.5vw,46px);margin-bottom:12px}
.sub{margin-top:14px}
#vw{border-radius:16px}
#vw:fullscreen,#vw.pf{background:#000;display:flex;align-items:center;justify-content:center;border-radius:0}
#vw:-webkit-full-screen{background:#000;display:flex;align-items:center;justify-content:center}
#vw.pf{position:fixed;inset:0;z-index:100}
#vw:fullscreen canvas,#vw.pf canvas{width:100%;height:100%;object-fit:contain;border:0;border-radius:0}
#vw:-webkit-full-screen canvas{width:100%;height:100%;object-fit:contain}
#qr img,#qr canvas{display:block}

.sign{animation:drop2 1.3s ease-out both;transform-origin:50% 0;margin-top:52px}
@keyframes drop2{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
.rope{top:-50px;height:58px;width:2px;background:#ffd66b;box-shadow:0 0 6px rgba(255,200,80,.6)}
.rope.l{left:16%;transform:rotate(9deg)}.rope.r{right:16%;transform:rotate(-9deg)}
.sign .lt{top:-7px;left:12px;right:12px;height:14px}
.sign .lt::before{background:radial-gradient(circle,#ff5a5a 0 4px,transparent 5px) 0 0/44px 14px;filter:drop-shadow(0 0 5px #ff8a8a)}
.sign .lt::after{background:radial-gradient(circle,#ffd34d 0 4px,transparent 5px) 22px 0/44px 14px;filter:drop-shadow(0 0 5px #ffe27a);animation-delay:-.65s}
.bgs{position:fixed;left:0;bottom:0;width:100vw;height:46vh;z-index:0;pointer-events:none}
.ff{position:fixed;width:5px;height:5px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 10px 3px rgba(255,220,120,.8);animation:ff var(--d) infinite;z-index:1;pointer-events:none}
@keyframes ff{0%{transform:translate(0,0);opacity:0}25%{opacity:1}100%{transform:translate(var(--x),-130px);opacity:0}}
.smk{animation:smk 4s infinite ease-out;transform-box:fill-box;transform-origin:center}
@keyframes smk{from{transform:translate(0,0) scale(.5);opacity:.7}to{transform:translate(16px,-60px) scale(2.2);opacity:0}}
.c{border:2px solid rgba(255,214,107,.55)}
.c::before{content:"";position:absolute;left:0;right:0;top:0;height:13px;background:radial-gradient(circle at 13px 0,#fff 0 12px,transparent 13px) 0 0/26px 13px;border-radius:22px 22px 0 0;opacity:.92;pointer-events:none}
.sub::after{content:"";display:block;width:120px;height:2px;margin:12px auto 0;background:linear-gradient(90deg,transparent,#ffd66b,transparent)}

@keyframes treeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes auroraDrift{0%,100%{transform:translate3d(-3%,0,0) rotate(-3deg);opacity:.22}50%{transform:translate3d(3%,1.5vh,0) rotate(3deg);opacity:.42}}
@keyframes hintGlow{0%,100%{text-shadow:0 0 0 rgba(255,214,107,0)}50%{text-shadow:0 0 14px rgba(255,214,107,.65)}}
body:not(.intro)::before{content:"";position:fixed;z-index:0;pointer-events:none;left:-25vw;right:-25vw;top:8vh;height:34vh;background:linear-gradient(100deg,transparent,rgba(33,220,190,.07),rgba(112,137,255,.13),rgba(255,204,100,.06),transparent);filter:blur(28px);animation:auroraDrift 16s ease-in-out infinite}
#tree{filter:drop-shadow(0 12px 18px rgba(0,0,0,.24));transform-origin:50% 80%;animation:treeFloat 5.5s ease-in-out infinite}
.hint{animation:tw 3s infinite,hintGlow 4s ease-in-out infinite}
.arb{isolation:isolate}
.arb::after{content:"✦";position:absolute;right:15px;top:5px;color:#fff7c7;font-size:12px;animation:tw 1.8s infinite;pointer-events:none}
@media(prefers-reduced-motion:reduce){#tree,body:not(.intro)::before,.hint,.arb::after{animation:none!important}}

#topstar{opacity:0;transform:scale(.25) rotate(-160deg);transform-box:fill-box;transform-origin:center;transition:opacity .45s ease,transform .95s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
#topstar.lit{opacity:1;transform:scale(1) rotate(0)}
.wrap .starbtn{order:5;margin-top:6px;font-size:13.5px;padding:11px 22px}
.wrap .arb{order:6}
.pred{transition:opacity .25s}

.orc{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:6px}
.orb{position:relative;width:168px;height:168px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
 background:
  radial-gradient(circle at 33% 27%,rgba(255,255,255,.98) 0 5%,rgba(255,255,255,.55) 9%,rgba(255,255,255,0) 34%),
  radial-gradient(circle at 50% 60%,#a8d6ff 0%,#5d78ff 36%,#3a26a8 68%,#150a44 100%);
 box-shadow:0 0 44px rgba(120,170,255,.55),0 0 100px rgba(120,170,255,.22),inset -16px -20px 46px rgba(0,0,0,.5),inset 14px 16px 34px rgba(255,255,255,.28);
 transition:transform .3s,box-shadow .3s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.orb:hover{transform:scale(1.05);box-shadow:0 0 62px rgba(150,195,255,.85),0 0 130px rgba(120,170,255,.3),inset -16px -20px 46px rgba(0,0,0,.5),inset 14px 16px 34px rgba(255,255,255,.3)}
.orb:active{transform:scale(.95)}
.orb svg{width:72%;height:72%;opacity:.92;animation:orbFloat 6s ease-in-out infinite}
@keyframes orbFloat{50%{transform:translateY(-5px) rotate(8deg)}}
.orb.spin svg{animation:orbSpin .95s cubic-bezier(.3,1.2,.4,1)}
@keyframes orbSpin{0%{transform:rotate(0) scale(1)}45%{transform:rotate(200deg) scale(1.14)}100%{transform:rotate(360deg) scale(1)}}
.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px dashed rgba(255,214,107,.3);animation:rot 30s linear infinite;pointer-events:none}
.fcard{width:100%;max-width:540px;border-radius:20px;padding:20px 18px;text-align:center;
 background:linear-gradient(160deg,rgba(52,42,130,.85),rgba(12,17,58,.94));
 border:1px solid rgba(255,214,107,.45);
 box-shadow:0 14px 44px rgba(0,0,0,.5),0 0 40px rgba(255,200,80,.12),inset 0 1px 0 rgba(255,255,255,.16)}
.fcard.show{animation:fcIn .65s cubic-bezier(.2,1.2,.4,1)}
@keyframes fcIn{from{opacity:0;transform:translateY(18px) rotateX(-32deg)}to{opacity:1;transform:none}}
.fchip{display:inline-block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:5px 13px;border-radius:999px;color:#3a2200;background:linear-gradient(180deg,#fff1b0,#ffc02e);box-shadow:0 3px 12px rgba(255,184,48,.35);margin-bottom:12px;font-weight:700}
.ftext{font-family:'Marck Script',cursive;font-size:23px;line-height:1.45;margin:0 0 14px;color:#fff;text-shadow:0 0 18px rgba(255,214,107,.25)}
.fmeta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:12px}
.fmeta span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:999px}
.fmeta b{color:var(--gold)}
</style>
</head>
<body class="intro">
<canvas id="snow"></canvas><div class="moon"></div>
<svg class="bgs" id="bgs" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMax slice"></svg>
<div id="intro"><div class="ray"></div><div class="ig"></div><div class="it">С Новым<br>годом!</div><div class="is">2 0 2 7</div><button id="enter">Войти в сказку</button></div>

<div class="row"><button class="btn" id="v1">Случайное видео</button><button class="btn" id="v2">Пауза</button><button class="btn" id="v3">Полный экран</button></div>`,
 i:()=>{const el=$('#vd'),x=el.getContext('2d'),W=720,H=400;let on=1,raf,t=0,cur=-1,fn;
  const bg=(a,b)=>{const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,W,H)};
  const stars=()=>{x.fillStyle='#fff';for(let i=0;i<50;i++){x.globalAlpha=.3+.7*Math.abs(Math.sin(t*2+i));x.fillRect(i*131%W,i*59%(H*.6),2,2)}x.globalAlpha=1};
  const SC=[['Праздничный салют',()=>{let ps=[];return()=>{x.fillStyle='rgba(4,8,30,.2)';x.fillRect(0,0,W,H);if(R()<.05){const h=R()*360,X=60+R()*600,Y=40+R()*180;for(let i=0;i<90;i++){const a=R()*6.28,s=R()*5+.8;ps.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:h+R()*50})}}
   ps=ps.filter(p=>p.l>0);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.985;p.vy*=.985;p.l-=.011;x.fillStyle=`hsla(${p.h},100%,65%,${p.l})`;x.beginPath();x.arc(p.x,p.y,2.2,0,7);x.fill()}}}],
  ['Заснеженная деревня',()=>{const f=[...Array(120)].map(()=>({x:R()*W,y:R()*H,r:1+R()*2,v:.5+R()}));return()=>{bg('#050b30','#1c3d86');stars();x.fillStyle='#fff8d0';x.beginPath();x.arc(600,70,28,0,7);x.fill();
   x.fillStyle='#dfeaff';x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=10)x.lineTo(i,300+Math.sin(i/90)*25);x.lineTo(W,H);x.fill();
   for(let i=0;i<4;i++){const hx=70+i*165,hy=290+Math.sin(hx/90)*25;x.fillStyle='#3a2414';x.fillRect(hx,hy-50,80,60);x.fillStyle='#fff';x.beginPath();x.moveTo(hx-10,hy-48);x.lineTo(hx+40,hy-90);x.lineTo(hx+90,hy-48);x.fill();x.fillStyle=`rgba(255,200,80,${.7+.3*Math.sin(t*4+i)})`;x.shadowColor='#ffb830';x.shadowBlur=14;x.fillRect(hx+14,hy-30,18,18);x.fillRect(hx+48,hy-30,18,18);x.shadowBlur=0}
   x.fillStyle='#fff';for(const a of f){a.y+=a.v;a.x+=Math.sin(t+a.r)*.5;if(a.y>H){a.y=0;a.x=R()*W}x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()}}}],
  ['Северное сияние',()=>()=>{bg('#02051a','#071a3a');stars();for(let b=0;b<3;b++){const g=x.createLinearGradient(0,60,0,300);g.addColorStop(0,['rgba(25,230,160,.55)','rgba(120,80,255,.5)','rgba(30,200,230,.5)'][b]);g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=12)x.lineTo(i,120+b*35+Math.sin(i/70+t*(.8+b*.3)+b)*45);x.lineTo(W,H);x.fill()}x.fillStyle='#050b1c';x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=20)x.lineTo(i,340+((i/20)%2?-30:0)-(i%80<20?20:0));x.lineTo(W,H);x.fill()}],
  ['Волшебные огни',()=>{const o=[...Array(34)].map((_,i)=>({x:R()*W,y:R()*H,r:14+R()*40,c:lc[i%5],v:.2+R()*.5}));return()=>{bg('#1a0838','#08143a');for(const a of o){a.y-=a.v;if(a.y<-60)a.y=H+60;const g=x.createRadialGradient(a.x,a.y,0,a.x,a.y,a.r);g.addColorStop(0,a.c);g.addColorStop(1,'transparent');x.globalAlpha=.35+.35*Math.sin(t*2+a.r);x.fillStyle=g;x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()}x.globalAlpha=1}}],
  ['Морозные узоры',()=>()=>{x.fillStyle='rgba(5,12,45,.18)';x.fillRect(0,0,W,H);x.save();x.translate(W/2,H/2);x.strokeStyle=`hsl(${190+t*20%60},100%,75%)`;x.lineWidth=2;for(let k=0;k<6;k++){x.rotate(1.047);const L=60+60*Math.sin(t);x.beginPath();x.moveTo(0,0);x.lineTo(0,L+90);for(let j=1;j<5;j++){x.moveTo(0,j*30);x.lineTo(25+Math.sin(t+j)*12,j*30+25);x.moveTo(0,j*30);x.lineTo(-25-Math.sin(t+j)*12,j*30+25)}x.stroke()}x.restore()}],
  ['Ёлка из огней',()=>()=>{bg('#050a2a','#0f1f5a');stars();for(let i=0;i<280;i++){const u=i/280,r=u*115,a=i*.6+t*1.5,X=W/2+Math.cos(a)*r,Y=60+u*300;x.globalAlpha=.3+.7*Math.abs(Math.sin(a));x.fillStyle=lc[i%5];x.shadowColor=lc[i%5];x.shadowBlur=10;x.beginPath();x.arc(X,Y,3,0,7);x.fill()}x.globalAlpha=1;x.fillStyle='#ffd66b';x.shadowColor='#ffc94d';x.shadowBlur=24+10*Math.sin(t*3);x.font='40px serif';x.textAlign='center';x.fillText('★',W/2,60);x.shadowBlur=0}]];
  const set=n=>{cur=n;fn=SC[n][1]();$('#vt').textContent='🎬 '+SC[n][0]+' · '+(n+1)+'/'+SC.length;x.clearRect(0,0,W,H)};
  set(0);const loop=()=>{if(on){t+=.03;fn()}raf=requestAnimationFrame(loop)};loop();
  $('#v1').onclick=()=>{let n;do n=R()*SC.length|0;while(n==cur);set(n)};
  $('#v2').onclick=()=>{on=!on;$('#v2').textContent=on?'Пауза':'Продолжить'};
  $('#v3').onclick=()=>{const w=$('#vw'),d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}if(w.classList.contains('pf')){w.classList.remove('pf');return}const rq=w.requestFullscreen||w.webkitRequestFullscreen;if(rq){try{const p=rq.call(w);if(p&&p.catch)p.catch(()=>w.classList.add('pf'))}catch(e){w.classList.add('pf')}}else w.classList.add('pf')};
  $('#vw').onclick=e=>{if(e.currentTarget.classList.contains('pf'))e.currentTarget.classList.remove('pf')};
  return()=>cancelAnimationFrame(raf)}},
3:{t:'Открытки',h:()=>`<canvas id="cc" class="cv" width="800" height="480"></canvas>
<label>Стиль открытки</label><div class="tabs" id="cs"><button class="btn" data-k="0">Ночная ёлка</button><button class="btn off" data-k="1">Рубиновый бал</button><button class="btn off" data-k="2">Морозный лес</button></div>
<label>Свой фон (необязательно)</label><input type="file" id="cf" accept="image/*">
<label>Ваше имя</label><input id="cn" placeholder="Например, Анна" maxlength="30">
<label>Поздравление</label><textarea id="ct" rows="2" maxlength="140">Пусть новый год принесёт много счастья, здоровья и удачи!</textarea>
<div class="row"><button class="btn" id="cb">Скачать открытку</button></div><div id="co" style="text-align:center"></div>`,
 i:()=>{const c=$('#cc'),x=c.getContext('2d');let bg=null,k=0;const TH=[['#0a1650','#1d4d8f','#ffd66b'],['#4a0618','#b3203a','#ffe9a0'],['#062a3a','#2a8fa8','#e8fbff']];
  const tree=(cx,by,s)=>{x.shadowBlur=0;x.fillStyle='#5a3418';x.fillRect(cx-8*s,by-12*s,16*s,14*s);boughs(x,cx,by,s);
   for(let i=0;i<14;i++){x.fillStyle=lc[i%5];x.shadowColor=lc[i%5];x.shadowBlur=8;x.beginPath();x.arc(cx+Math.sin(i*2.1)*(10+i*3.4)*s,by-(150-i*10)*s,3.2*s,0,7);x.fill()}
   x.shadowColor='#ffc94d';x.shadowBlur=18;x.fillStyle='#ffd66b';x.font=48*s+'px serif';x.textAlign='center';x.fillText('★',cx,by-168*s);x.shadowBlur=0};
  const draw=()=>{const T=TH[k];if(bg){const s=Math.max(800/bg.width,480/bg.height);x.drawImage(bg,(800-bg.width*s)/2,(480-bg.height*s)/2,bg.width*s,bg.height*s);x.fillStyle='rgba(0,0,30,.35)';x.fillRect(0,0,800,480)}else{const g=x.createLinearGradient(0,0,0,480);g.addColorStop(0,T[0]);g.addColorStop(1,T[1]);x.fillStyle=g;x.fillRect(0,0,800,480);
    for(let i=0;i<26;i++){const r=14+i*7%40,gg=x.createRadialGradient(i*149%800,i*83%480,0,i*149%800,i*83%480,r);gg.addColorStop(0,'rgba(255,230,150,.35)');gg.addColorStop(1,'transparent');x.fillStyle=gg;x.beginPath();x.arc(i*149%800,i*83%480,r,0,7);x.fill()}
    for(let i=0;i<110;i++){x.fillStyle=`rgba(255,255,255,${.3+i%5/8})`;x.beginPath();x.arc(i*97%800,i*53%480,1+i%3,0,7);x.fill()}tree(90,450,1.5);tree(715,450,1.5)}
   x.fillStyle='#e8f1ff';x.fillRect(0,462,800,18);
   x.strokeStyle=T[2];x.lineWidth=4;x.strokeRect(14,14,772,452);x.lineWidth=1;x.strokeRect(24,24,752,432);for(const[a,b]of[[24,24],[776,24],[24,456],[776,456]]){x.fillStyle=T[2];x.save();x.translate(a,b);x.rotate(.785);x.fillRect(-7,-7,14,14);x.restore()}
   x.beginPath();x.moveTo(24,24);for(let i=0;i<=752;i+=8){x.lineTo(24+i,24+30*Math.sin(Math.PI*i/752))}x.strokeStyle='#2b1a0c';x.lineWidth=1.5;x.stroke();for(let i=1;i<24;i++){const px=24+i*31,py=24+30*Math.sin(Math.PI*i*31/752);x.fillStyle=lc[i%5];x.shadowColor=lc[i%5];x.shadowBlur=10;x.beginPath();x.arc(px,py+4,4.5,0,7);x.fill()}x.shadowBlur=0;
   x.fillStyle='rgba(0,8,40,.4)';x.fillRect(180,110,440,270);x.textAlign='center';x.shadowColor='#000';x.shadowBlur=10;x.fillStyle=T[2];x.font='64px Marck Script,cursive,serif';x.fillText('С Новым годом!',400,185);x.shadowBlur=6;x.fillStyle='#fff';x.font='20px Montserrat,sans-serif';let ln='',y=240;for(const w of $('#ct').value.split(' ')){if(x.measureText(ln+w).width>380){x.fillText(ln,400,y);ln='';y+=30}ln+=w+' '}x.fillText(ln,400,y);
   x.fillStyle=T[2];x.font='italic 26px Marck Script,cursive,serif';if($('#cn').value)x.fillText('С любовью, '+$('#cn').value,400,355);x.shadowBlur=0};
  draw();['cn','ct'].forEach(i=>$('#'+i).oninput=draw);document.fonts&&document.fonts.ready.then(draw);
  document.querySelectorAll('#cs .btn').forEach(b=>b.onclick=()=>{k=+b.dataset.k;bg=null;document.querySelectorAll('#cs .btn').forEach(q=>q.classList.toggle('off',q!=b));draw()});
  $('#cf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{bg=im;draw()};im.src=URL.createObjectURL(f)};
  $('#cb').onclick=()=>{draw();const u=c.toDataURL('image/png'),a=document.createElement('a');a.href=u;a.download='otkrytka.png';a.click();$('#co').innerHTML=`<p style="font-size:13px;opacity:.8">Если загрузка не началась — нажмите на картинку и сохраните её:</p><img src="${u}" style="max-width:100%;border-radius:12px">`}}},

4:{t:'Волшебный снежный шар',h:()=>`<canvas id="gc" class="cv" width="360" height="392" style="max-width:360px;background:none;border:0;border-radius:0"></canvas>
<div class="pred" id="gw" style="font-size:17px;min-height:74px;padding:0 8px;display:flex;align-items:center;justify-content:center">Потрясите шар — и загадайте самое заветное ✨</div>
<div class="row">
<button class="btn" id="g1">❄️ Снегопад</button>
<button class="btn" id="g2">✨ Гирлянда</button>
<button class="btn off" id="g3">⭐ Звезда</button>
<button class="btn" id="g4">🌙 Ночь</button>
<button class="btn" id="g5">💫 Желание</button>
</div>`,
 i:()=>{
  const c=$('#gc'),x=c.getContext('2d');
  const CX=180,CY=172,RAD=134;
  let night=1,lights=1,starOn=0,t=0,raf,shoot=null;
  const flakes=[];
  const addSnow=n=>{for(let i=0;i<n;i++)flakes.push({x:CX+(R()-.5)*250,y:R()*250+20,r:.8+R()*2.4,vy:.3+R()*.8,vx:(R()-.5)*.4,p:R()*6})};
  addSnow(150);
  const W=[
   'Пусть в этом году у тебя будет больше дней, о которых хочется вспоминать.',
   'Пусть найдётся тот, кто будет ждать тебя с работы и спрашивать, как прошёл день.',
   'Пусть все твои «не сейчас» однажды превратятся в «уже пора».',
   'Пусть в доме всегда пахнет чем-то тёплым, а за окном будет кто-то, кто спешит к тебе.',
   'Пусть то, что ты так долго нёс в себе, наконец отпустит — и станет легко.',
   'Пусть звонят не по делу, а просто чтобы услышать твой голос.',
   'Пусть каждое твоё «я устал» заканчивается чьим-то «отдохни, я рядом».',
   'Пусть у тебя получится то, о чём ты боялся даже мечтать.',
   'Пусть в новом году будет больше поводов смеяться до слёз.',
   'Пусть всё, что ты отдал людям, вернётся к тебе теплом.'
  ];
  const star5=(cx,cy,r,fill,blur)=>{x.save();x.shadowColor='#ffd66b';x.shadowBlur=blur;x.fillStyle=fill;x.beginPath();
    for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.44:r;
      const px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)}
    x.closePath();x.fill();x.restore()};
  const shake=()=>flakes.forEach(a=>{a.vy=-2-R()*3;a.vx=(R()-.5)*5});

  const loop=()=>{
    t+=.02;
    x.clearRect(0,0,360,392);

    const gl=x.createRadialGradient(CX,CY,RAD*.7,CX,CY,RAD*1.3);
    gl.addColorStop(0,'rgba(120,180,255,.18)');gl.addColorStop(1,'rgba(120,180,255,0)');
    x.fillStyle=gl;x.beginPath();x.arc(CX,CY,RAD*1.3,0,7);x.fill();

    x.save();
    x.beginPath();x.arc(CX,CY,RAD,0,7);x.clip();

    const g=x.createLinearGradient(0,CY-RAD,0,CY+RAD);
    if(night){g.addColorStop(0,'#050b38');g.addColorStop(.55,'#0f2a6b');g.addColorStop(1,'#2a4a92')}
    else{g.addColorStop(0,'#8ecbff');g.addColorStop(.55,'#c8e8ff');g.addColorStop(1,'#f0faff')}
    x.fillStyle=g;x.fillRect(0,0,360,392);

    if(night){
      for(let i=0;i<28;i++){
        const sx=CX+((i*89)%250)-125,sy=CY-118+((i*53)%210);
        x.globalAlpha=.3+.7*Math.abs(Math.sin(t*1.6+i));
        x.fillStyle='#fff';x.beginPath();x.arc(sx,sy,1.2,0,7);x.fill();
      }
      x.globalAlpha=1;
      x.save();x.shadowColor='#fff3c0';x.shadowBlur=26;x.fillStyle='#fff6cf';
      x.beginPath();x.arc(246,88,16,0,7);x.fill();
      x.fillStyle='#0f2a6b';x.beginPath();x.arc(252,82,14,0,7);x.fill();
      x.restore();
    }

    x.fillStyle=night?'#e9f3ff':'#ffffff';
    x.beginPath();x.ellipse(CX,288,170,50,0,0,7);x.fill();
    x.fillStyle=night?'#d3e4fa':'#eaf5ff';
    x.beginPath();x.ellipse(CX-52,280,74,24,0,0,7);x.fill();
    x.beginPath();x.ellipse(CX+64,286,58,20,0,0,7);x.fill();

    boughs(x,CX,280,1.06);

    if(starOn){
      star5(CX,97,14,'#ffd66b',18+8*Math.abs(Math.sin(t*3)));
      x.save();x.globalAlpha=.35+.3*Math.abs(Math.sin(t*2));
      x.fillStyle='#fff3c0';x.beginPath();x.arc(CX,97,22,0,7);x.fill();x.restore();
    }

    if(lights){
      for(let k=0;k<20;k++){
        const yy=118+k*8.4, hw=(yy-105)*.40;
        const xx=CX+Math.sin(k*2.3)*hw*.85;
        const col=lc[k%5];
        x.globalAlpha=.4+.6*Math.abs(Math.sin(t*2+k*.7));
        x.fillStyle=col;x.shadowColor=col;x.shadowBlur=10;
        x.beginPath();x.arc(xx,yy,2.8,0,7);x.fill();
      }
      x.globalAlpha=1;x.shadowBlur=0;
    }

    const gift=(gx,gy,w,h,a,b,rib)=>{
      x.fillStyle=b;x.fillRect(gx,gy,w,h);
      x.fillStyle=a;x.fillRect(gx,gy,w,h*.45);
      x.fillStyle=rib;x.fillRect(gx+w/2-2,gy,4,h);
      x.fillRect(gx,gy+h*.45-3,w,5);
      x.fillStyle='#fff';x.globalAlpha=.35;x.fillRect(gx+3,gy+3,w*.3,2);x.globalAlpha=1;
    };
    gift(112,262,20,18,'#ff4d6d','#a80d24','#ffd66b');
    gift(226,268,17,15,'#4dd2ff','#0a6fb0','#ffe9a0');

    x.fillStyle='#f7fbff';
    x.beginPath();x.arc(254,258,9,0,7);x.fill();
    x.beginPath();x.arc(254,272,13,0,7);x.fill();
    x.fillStyle='#ff7a3c';x.beginPath();x.moveTo(254,258);x.lineTo(262,260);x.lineTo(254,261);x.fill();
    x.fillStyle='#1a2340';x.beginPath();x.arc(251,256,1.1,0,7);x.fill();x.beginPath();x.arc(257,256,1.1,0,7);x.fill();

    for(let i=0;i<flakes.length;i++){
      const a=flakes[i];
      a.y+=a.vy;a.x+=a.vx+Math.sin(t+a.p)*.3;a.vy+=(.45-a.vy)*.012;a.vx*=.995;
      if(a.y>292){a.y=30-R()*20;a.x=CX+(R()-.5)*230;a.vy=.3+R()*.8;a.vx=(R()-.5)*.4}
      if(a.x<CX-145)a.x=CX+145;if(a.x>CX+145)a.x=CX-145;
      x.fillStyle='rgba(255,255,255,.95)';
      x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill();
    }

    if(shoot){
      shoot.x+=shoot.vx;shoot.y+=shoot.vy;shoot.l-=.011;
      if(shoot.l<=0)shoot=null;
      else{
        const grd=x.createLinearGradient(shoot.x-46,shoot.y-26,shoot.x,shoot.y);
        grd.addColorStop(0,'rgba(255,235,170,0)');
        grd.addColorStop(1,'rgba(255,235,170,'+shoot.l+')');
        x.strokeStyle=grd;x.lineWidth=2.4;x.lineCap='round';
        x.beginPath();x.moveTo(shoot.x-46,shoot.y-26);x.lineTo(shoot.x,shoot.y);x.stroke();
        x.fillStyle='rgba(255,245,200,'+shoot.l+')';
        x.beginPath();x.arc(shoot.x,shoot.y,2.4,0,7);x.fill();
      }
    }

    x.restore();

    x.lineWidth=3;x.strokeStyle='rgba(255,255,255,.5)';
    x.beginPath();x.arc(CX,CY,RAD,0,7);x.stroke();
    x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=6;
    x.beginPath();x.arc(CX,CY,RAD-13,3.42,4.42);x.stroke();
    x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=3;
    x.beginPath();x.arc(CX,CY,RAD-24,3.9,4.5);x.stroke();

    const bg2=x.createLinearGradient(0,286,0,392);
    bg2.addColorStop(0,'#c08b3c');bg2.addColorStop(.35,'#7a4c1c');bg2.addColorStop(1,'#2a1608');
    x.fillStyle=bg2;
    x.beginPath();x.moveTo(CX-108,292);x.lineTo(CX+108,292);x.lineTo(CX+128,380);x.lineTo(CX-128,380);x.closePath();x.fill();
    x.fillStyle='#ffd66b';
    x.beginPath();x.moveTo(CX-110,288);x.lineTo(CX+110,288);x.lineTo(CX+106,297);x.lineTo(CX-106,297);x.closePath();x.fill();
    x.fillStyle='rgba(255,214,107,.9)';x.font='600 15px Montserrat,sans-serif';x.textAlign='center';
    x.fillText('2 0 2 7',CX,352);

    raf=requestAnimationFrame(loop);
  };
  loop();

  c.onclick=()=>{addSnow(30);shake()};
  $('#g1').onclick=()=>{addSnow(60);shake()};
  $('#g2').onclick=e=>{lights=!lights;e.currentTarget.classList.toggle('off',!lights)};
  $('#g3').onclick=e=>{starOn=!starOn;e.currentTarget.classList.toggle('off',!starOn);if(starOn)sfx()};
  $('#g4').onclick=e=>{night=!night;e.currentTarget.classList.toggle('off',!night)};
  $('#g5').onclick=()=>{
    const el=$('#gw');
    el.style.opacity='0';
    setTimeout(()=>{
      el.textContent=pick(W);
      el.style.opacity='1';
      el.style.animation='none';void el.offsetWidth;el.style.animation='';
    },200);
    shoot={x:CX-110,y:CY-92,vx:2.5,vy:1.5,l:1};
    sfx();
  };

  return()=>cancelAnimationFrame(raf)
 }},

5:{t:'Новогодние стихи',h:()=>`<div class="tabs" id="pt"></div><div class="poem" id="pp"></div><div style="text-align:center;font-size:26px;margin-top:10px">🎄 ❄️ 🎁 ⭐ 🎅</div>`,
 i:()=>{const L=[['Снегопад','Тихо падает снег на ресницы,\nГород спит в серебристом огне.\nПусть всё доброе в жизни случится —\nИ в году, и сейчас, и во сне.'],['Ёлка','Зажигается ёлка огнями,\nКаждый шарик — как маленький мир.\nЗагадай своё чудо заранее —\nСкоро будет и сказка, и пир.'],['Куранты','Бьют куранты — двенадцать ударов,\nЗагадай по мечте на каждый.\nПусть удача идёт по пятам,\nА тревоги отпустят однажды.'],['Мандарины','Пахнет в доме хвоей и мандаринами,\nЗа окном метель поёт и вьётся.\nПусть год новый, добрый и красивый\nКаждому подарком попадётся.'],['Снеговик','Во дворе стоит снеговик,\nНос морковкой, в руке метла.\nОн за зиму к морозу привык —\nЛишь бы радость к нам зашла.'],['Подарок','Под ёлкой ждёт заветный свёрток,\nЛентой атласной перевит.\nПусть в нём окажется, как в сказке,\nВсё то, что сердце хранит.'],['Дед Мороз','Дед Мороз по свету мчится,\nМешок подарков за спиной.\nПусть к тебе он постучится\nИ подарит свет и покой.']];
  const sh=n=>{const p=$('#pp');p.textContent=L[n][1];p.style.animation='none';void p.offsetWidth;p.style.animation='';document.querySelectorAll('#pt .btn').forEach((b,i)=>b.classList.toggle('off',i!=n))};
  L.forEach((q,n)=>{const b=document.createElement('button');b.className='btn off';b.textContent=q[0];b.onclick=()=>sh(n);$('#pt').append(b)});sh(0)}},

6:{t:'Новогоднее предсказание',h:()=>`<div class="orc">
  <div class="orb" id="orcball" role="button" tabindex="0" aria-label="Кристальный шар предсказаний">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke="#eaf3ff" stroke-width="1.5" stroke-linecap="round" opacity=".85">${SF}</g>
      <circle cx="50" cy="50" r="2.6" fill="#fff" opacity=".95"/>
    </svg>
  </div>
  <div class="fcard" id="orccard">
    <div class="fchip">✦ Шар ждёт</div>
    <p class="ftext">Прикоснись к шару — и он расскажет, что готовит тебе этот год.</p>
  </div>
  <button class="btn" id="orcmore">✨ Ещё предсказание</button>
</div>`,
 i:()=>{
  const ball=$('#orcball'),card=$('#orccard');
  const COLORS=[['золотой','#ffd66b'],['изумрудный','#48e0a0'],['алый','#ff6b7a'],['небесный','#6ec6ff'],['серебряный','#dfe8ff'],['сливовый','#c58bff'],['медный','#e08a3c'],['мятный','#7dffc4']];
  let last=-1;
  const reveal=()=>{
    let n;do{n=R()*PRED.length|0}while(n===last);
    last=n;
    const p=PRED[n],num=1+(R()*99|0),col=pick(COLORS);
    card.innerHTML='<div class="fchip">'+p.c+'</div>'+
      '<p class="ftext">'+p.t+'</p>'+
      '<div class="fmeta"><span>Счастливое число: <b>'+num+'</b></span>'+
      '<span>Цвет удачи: <b style="color:'+col[1]+'">'+col[0]+'</b></span></div>';
    card.classList.remove('show');void card.offsetWidth;card.classList.add('show');
  };
  const spin=()=>{
    ball.classList.remove('spin');void ball.offsetWidth;ball.classList.add('spin');
    sfx();
    const r=ball.getBoundingClientRect();
    for(let i=0;i<14;i++){
      const s=document.createElement('div');s.className='sp';
      s.textContent=pick(['✦','✧','✨','❄']);
      s.style.cssText='left:'+(r.left+r.width/2+(R()-.5)*110)+'px;top:'+(r.top+r.height/2+(R()-.5)*110)+'px;font-size:'+(10+R()*14)+'px';
      document.body.append(s);setTimeout(()=>s.remove(),900);
    }
    setTimeout(reveal,420);
  };
  ball.onclick=spin;
  ball.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();spin()}};
  $('#orcmore').onclick=spin;
 }},

7:{t:'AR-открытка с QR-кодом',h:()=>`<p style="text-align:center;margin-top:0">Введите имя получателя, покажите QR-код другу, и он наведёт на него камеру телефона. Откроется AR: 3D-ёлка, салюты и поздравление прямо поверх камеры.</p>
<input id="an" placeholder="Имя получателя (необязательно)" maxlength="24"><div style="text-align:center"><div id="qr"></div><br><p class="vl" style="color:#fff;opacity:.85">Отсканируйте QR камерой телефона. Камера открытки включается после нажатия на кнопку. Для работы камера требует опубликованный сайт по HTTPS и разрешение в браузере.</p><a class="btn" id="ql" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Открыть открытку</a><div class="row"><button class="btn" id="qdl">Скачать QR-код</button><button class="btn" id="qsh">Поделиться</button><button class="btn" id="qcp">Копировать ссылку</button></div><p id="qmsg" class="vl" aria-live="polite"></p></div>`,
 i:()=>{const mk=()=>{const u=new URL('ar.html',location.href);u.search='';u.hash='';if($('#an').value.trim())u.searchParams.set('to',$('#an').value.trim());$('#qr').innerHTML='';$('#ql').href=u.href;if(window.QRCode){try{new QRCode($('#qr'),{text:u.href,width:240,height:240,colorDark:'#0a1440',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H})}catch(e){}}if(!$('#qr').children.length)$('#qr').innerHTML='<img width=240 height=240 alt="QR-код открытки" src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=2&data='+encodeURIComponent(u.href)+'">'};mk();$('#an').oninput=mk;$('#qdl').onclick=()=>{const el=$('#qr').querySelector('canvas, img');if(!el){$('#qmsg').textContent='QR-код ещё загружается.';return}const a=document.createElement('a');a.download='novogodnyaya-otkrytka-QR.png';a.href=el.tagName==='CANVAS'?el.toDataURL('image/png'):el.src;a.click();$('#qmsg').textContent='QR-код сохранён.'};$('#qsh').onclick=async()=>{const u=$('#ql').href;try{if(navigator.share)await navigator.share({title:'Новогодняя открытка',text:'Открой мою новогоднюю AR-открытку 🎄',url:u});else{await navigator.clipboard.writeText(u);$('#qmsg').textContent='Ссылка скопирована — отправьте её вместе с QR-кодом.'}}catch(e){if(e.name!=='AbortError')$('#qmsg').textContent='Скопируйте ссылку кнопкой ниже.'}};$('#qcp').onclick=async()=>{try{await navigator.clipboard.writeText($('#ql').href);$('#qmsg').textContent='Ссылка скопирована.'}catch(e){$('#qmsg').textContent=$('#ql').href}}}}
};
function open(n){const p=P[n];$('#mt').textContent=p.t;$('#mb').innerHTML=p.h();$('#m').classList.add('on');clean=p.i&&p.i()||null}
function close(){$('#m').classList.remove('on');clean&&clean();clean=null;$('#mb').innerHTML=''}
$('#arb').onclick=()=>open(7);
document.querySelectorAll('.b').forEach(b=>{b.onclick=()=>open(b.dataset.n);b.onkeydown=e=>{if(e.key=='Enter')open(b.dataset.n)}});
$('.x').onclick=close;$('#m').onclick=e=>{if(e.target.id=='m')close()};addEventListener('keydown',e=>{if(e.key=='Escape')close()});
